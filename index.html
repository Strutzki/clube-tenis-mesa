<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Domínio canônico: quem abrir pelo .vercel.app (sufixo público que quebra a
         sincronização de passkey/biometria no Android/Google) é enviado ao domínio
         oficial ANTES do app carregar. O domínio oficial não dispara isto (sem loop). -->
    <script>
      (function () {
        try {
          if (location.hostname === "clube-tenis-mesa.vercel.app") {
            location.replace("https://clubedotenisdemesabh.com.br" + location.pathname + location.search + location.hash);
          }
        } catch (e) {}
      })();
    </script>

    <!-- Título -->
    <title>Clube do Tênis de Mesa BH</title>
    <meta name="description" content="Circuito de Tênis de Mesa de Belo Horizonte" />

    <!-- Ícone padrão (favicon) -->
    <link rel="icon" type="image/png" href="/logo-192.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS -->
    <link rel="apple-touch-icon" href="/logo-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CTM BH" />

    <!-- Android / Chrome -->
    <meta name="theme-color" content="#1d3a31" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Vercel Analytics (sem necessidade de pacote npm — funciona com qualquer framework) -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
